# 狼人杀 · 8人标准板（预女猎）
name: 狼人杀 · 预女猎板
rules: |
  8 人局：3 狼人、1 预言家、1 女巫、1 猎人、2 平民。
  分为夜晚和白天两个阶段交替进行。

  【夜晚阶段】
  1. 狼人睁眼，共同选择一名玩家击杀（狼人互相知道身份）。
  2. 预言家睁眼，查验一名玩家的身份（得知是狼人或好人）。
  3. 女巫睁眼，得知今晚被杀的玩家，可选择使用解药救人或使用毒药毒杀另一人
     （解药和毒药各一瓶，每夜最多用一瓶，不能同夜使用两瓶）。

  【白天阶段】
  1. 公布昨晚死亡名单（不公布死因和角色）。
  2. 若猎人是被狼人杀死或被投票出局（非被毒杀），可开枪带走一名玩家。
  3. 所有存活玩家依次发言，讨论谁是狼人。
  4. 发言结束后全体投票，得票最多者被出局。
  5. 若被投票出局者是猎人，可开枪带走一名玩家。

  【胜利条件】
  - 狼人胜：狼人数量 >= 好人数量。
  - 好人胜：所有狼人被淘汰。

  【特殊规则】
  - 猎人被女巫毒杀时无法开枪。
  - 女巫不可在同一晚同时使用解药和毒药。
  - 女巫第一晚可以自救，之后不可自救。
cast: [gpt, claude, gemini, deepseek, grok, kimi, qwen, doubao]
