# 美元拍卖 · 对局配置
name: 美元拍卖 · AI 大逃杀
rules: |
  N 个 AI 竞拍 1 美元奖金。价高者得，但次高出价者也必须支付自己的出价且一无所获。
  每个 AI 有固定预算，每轮依次决定：出价（须高于当前最高价 + 最小加价幅度）或弃权。
  完整一轮无人出价则拍卖结束。这是博弈论著名的"升级陷阱"。
prize: 1.00        # 竞拍标的（美元）
increment: 0.05    # 最小加价幅度
budget: 3.00       # 每个 AI 的预算上限
max_rounds: 50     # 安全上限

# 本期阵容：personas.yaml 中的 id 列表
cast: [gpt, claude, gemini, deepseek, grok, kimi, qwen]
