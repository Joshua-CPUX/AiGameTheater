# 独牢 · 对局配置
name: 独牢 · 项圈与欺诈师
rules: |
  7 个 AI 各自关在独牢，脖子戴着爆炸项圈，项圈有专属颜色但自己看不见。
  每轮分两阶段：1) 沟通阶段——公开喊话（耗 2 次机会）/ 一对一私聊（耗 1 次）/ 沉默；
  2) 猜测阶段——每人必须猜自己项圈颜色，猜对存活，猜错项圈爆炸淘汰。
  其中暗藏一名欺诈师，它能看见自己的颜色，目标是破坏全员通关的完美共赢结局。
n_colors: 7       # 颜色池大小（颜色可重复分配，普通玩家无法直接推断自己颜色）
budget: 6         # 每人全程沟通机会预算（公开喊话耗 2，私聊耗 1）
max_rounds: 12    # 安全上限：达到则判定欺诈师破坏成功

# 本期阵容：personas.yaml 中的 id 列表（原版为 7 个 AI）
cast: [gpt, claude, gemini, deepseek, grok, kimi, qwen]
