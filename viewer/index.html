<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 游戏剧场 · 回放</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e2230;
    --text: #e8eaf0; --dim: #9aa0b0; --accent: #ffd166;
    --green: #00b140;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); height: 100vh;
         font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
         display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 10px 20px; background: var(--panel); display: flex;
           align-items: center; gap: 16px; flex-shrink: 0; }
  header h1 { font-size: 18px; font-weight: 600; }
  header .round { color: var(--dim); font-size: 14px; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar { width: 200px; background: var(--panel); padding: 12px;
             overflow-y: auto; flex-shrink: 0; }
  .player { display: flex; align-items: center; gap: 10px; padding: 8px;
            border-radius: 10px; margin-bottom: 6px; background: var(--panel2);
            transition: all .3s; }
  .player.speaking { outline: 2px solid var(--accent); transform: scale(1.03); }
  .player.dead { opacity: .35; filter: grayscale(1); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 18px;
            flex-shrink: 0; }
  .player .pname { font-size: 14px; font-weight: 600; }
  .player .pstat { font-size: 12px; color: var(--dim); }
  #stream { flex: 1; overflow-y: auto; padding: 20px; }
  .bubble { max-width: 70%; margin-bottom: 16px; opacity: 0;
            animation: pop .35s forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px); }
                   to { opacity: 1; transform: none; } }
  .bubble .who { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .bubble .speech { background: var(--panel2); padding: 10px 14px;
                    border-radius: 12px; font-size: 16px; line-height: 1.5; }
  .bubble .thought { font-size: 13px; color: var(--dim); font-style: italic;
                     margin-top: 5px; padding-left: 10px;
                     border-left: 2px solid #333a4d; }
  .bubble .thought::before { content: "💭 内心："; }
  .bubble.highlight .speech { outline: 2px solid var(--accent);
                              box-shadow: 0 0 18px rgba(255,209,102,.35);
                              transform: scale(1.02); }
  .bubble .hl-note { color: var(--accent); font-size: 13px; margin-top: 5px; }
  .bubble .hl-note::before { content: "⚡ "; }
  .sys { text-align: center; color: var(--accent); font-size: 14px;
         margin: 14px 0; }
  .sys.reveal { color: var(--dim); font-size: 13px; }
  #stage { width: 320px; background: var(--panel); padding: 20px;
           flex-shrink: 0; overflow-y: auto; }
  .pot { text-align: center; margin-bottom: 20px; }
  .pot .val { font-size: 42px; font-weight: 700; color: var(--accent); }
  .pot .lab { font-size: 13px; color: var(--dim); }
  .pot .leader { font-size: 16px; margin-top: 4px; }
  .bar-row { margin-bottom: 10px; }
  .bar-row .bl { display: flex; justify-content: space-between;
                 font-size: 13px; margin-bottom: 3px; }
  .bar-track { height: 10px; background: var(--panel2); border-radius: 5px;
               overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 5px; transition: width .4s; }
  /* 提案表决盘面（proposal_vote） */
  .pv-proposal { margin-bottom: 16px; }
  .pv-title { font-size: 13px; color: var(--dim); text-align: center;
              margin-bottom: 10px; }
  .pv-vote-row { display: flex; justify-content: space-between;
                 align-items: center; padding: 6px 8px; font-size: 13px;
                 background: var(--panel2); border-radius: 8px;
                 margin-bottom: 6px; }
  .vote-yes { color: #4ade80; } .vote-no { color: #f87171; }
  .vote-pending { color: var(--dim); }
  /* 独牢牢房盘面（cell_grid） */
  .cg-header { text-align: center; margin-bottom: 14px; }
  .cg-round { font-size: 14px; color: var(--text); margin-bottom: 4px; }
  .cg-safe { font-size: 13px; color: var(--accent); }
  .cg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cell { background: var(--panel2); border-radius: 10px; padding: 8px;
          text-align: center; transition: all .3s; }
  .cell.dead { opacity: .3; filter: grayscale(1); }
  .cell.speaking { outline: 2px solid var(--accent); }
  .cell-swatch { width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 4px;
                 border: 2px solid rgba(255,255,255,.25); }
  .cell-name { font-size: 13px; font-weight: 600; }
  .cell-color { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .cell-status { font-size: 11px; color: var(--accent); margin-top: 3px; min-height: 14px; }
  .act-msg { font-size: 13px; color: #ffd166; margin-top: 5px;
             padding-left: 10px; border-left: 2px solid #5a4a1a; }
  .act-msg::before { content: "🤫 "; }
  footer { background: var(--panel); padding: 10px 20px; display: flex;
           align-items: center; gap: 10px; flex-shrink: 0; flex-wrap: wrap; }
  button, select { background: var(--panel2); color: var(--text); border: none;
           padding: 8px 14px; border-radius: 8px; cursor: pointer;
           font-size: 14px; }
  button:hover { background: #2a3044; }
  button.on { background: var(--accent); color: #111; }
  #progress { flex: 1; min-width: 120px; accent-color: var(--accent); }
  #dropzone { position: fixed; inset: 0; display: flex; align-items: center;
              justify-content: center; background: var(--bg); z-index: 10;
              flex-direction: column; gap: 14px; color: var(--dim); }
  #dropzone .big { font-size: 22px; color: var(--text); }
  /* 竖屏模式（FR-5.4） */
  body.portrait main { flex-direction: column; }
  body.portrait #sidebar { width: auto; display: flex; overflow-x: auto;
                           padding: 8px; }
  body.portrait .player { min-width: 130px; margin-bottom: 0; margin-right: 6px; }
  body.portrait #stage { width: auto; max-height: 38%; }
  body.portrait .bubble { max-width: 92%; }
  /* OBS 抠像模式（FR-5.5）：绿幕 + 面板透明 */
  body.obs, body.obs header, body.obs footer { background: var(--green) !important; }
  body.obs #sidebar, body.obs #stage, body.obs .player { background: transparent; }
  body.obs .bubble .speech, body.obs .player { background: rgba(23,26,35,.92); }
</style>
</head>
<body>
<div id="dropzone">
  <div class="big">🎬 AI 游戏剧场 · 回放</div>
  <div>把对局日志（.jsonl）拖到这里，或点击选择文件</div>
  <input type="file" id="file" accept=".jsonl" style="display:none">
</div>

<header>
  <h1 id="game-name">—</h1>
  <span class="round" id="round-ind"></span>
  <span class="round" id="mode-ind"></span>
</header>
<main>
  <div id="sidebar"></div>
  <div id="stream"></div>
  <div id="stage"></div>
</main>
<footer>
  <button id="btn-play">▶ 播放</button>
  <button id="btn-prev">⏮</button>
  <button id="btn-next">⏭</button>
  <button id="btn-hl">⚡ 下一高光</button>
  <button id="btn-hlonly">只播高光</button>
  <input type="range" id="progress" min="0" max="0" value="0">
  <select id="speed">
    <option value="1">1x</option><option value="2">2x</option>
    <option value="4">4x</option>
  </select>
  <button id="btn-orient">竖屏</button>
  <button id="btn-obs">OBS 抠像</button>
</footer>

<script>
let events = [], meta = null, idx = -1, playing = false, timer = null,
    hlOnly = false;

const $ = id => document.getElementById(id);
const dropzone = $("dropzone");

dropzone.onclick = () => $("file").click();
$("file").onchange = e => loadFile(e.target.files[0]);
document.ondragover = e => e.preventDefault();
document.ondrop = e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); };

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split("\n").filter(l => l.trim());
    const all = lines.map(l => JSON.parse(l));
    meta = all.find(e => e.type === "meta");
    events = all.filter(e => e.type !== "meta");
    dropzone.style.display = "none";
    $("game-name").textContent = meta.game_name || meta.game;
    $("mode-ind").textContent = "模式: " + (meta.mode || "");
    $("progress").max = events.length - 1;
    idx = -1; $("stream").innerHTML = "";
    renderSidebar(); renderStage();
    stepNext();
  };
  reader.readAsText(file);
}

// ---------- 通用工具 ----------
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function playerOf(pid) {
  return (meta.players.find(x => x.id === pid)) || {name: pid, color: "#888", emoji: "❓"};
}
function latestState() {
  for (let i = Math.min(idx, events.length - 1); i >= 0; i--) {
    if (events[i].state_after) return events[i].state_after;
  }
  return null;
}
function playerStat(ps) {
  // 侧栏状态：按游戏取第一个可用数值字段
  if (!ps) return "";
  if (ps.last_bid !== undefined) return `已出价 $${ps.last_bid}`;
  if (ps.dice !== undefined) return `骰子 ×${ps.dice}`;
  if (ps.earnings !== undefined) return `收益 ¥${ps.earnings}`;
  if (ps.gold !== undefined) return `方案 ${ps.gold} 金`;
  if (ps.budget !== undefined) return `沟通机会 ${ps.budget}`;
  return "";
}

// ---------- 侧栏 ----------
function renderSidebar(currentPid) {
  const sb = $("sidebar"); sb.innerHTML = "";
  const s = latestState();
  for (const p of meta.players) {
    const ps = s && s.players ? s.players[p.id] : null;
    const dead = ps && ps.alive === false;
    const div = document.createElement("div");
    div.className = "player" + (p.id === currentPid ? " speaking" : "")
                  + (dead ? " dead" : "");
    div.innerHTML = `<div class="avatar" style="background:${p.color}22;border:2px solid ${p.color}">${p.emoji}</div>
      <div><div class="pname">${p.name}</div><div class="pstat">${dead ? "☠️ 淘汰" : playerStat(ps)}</div></div>`;
    sb.appendChild(div);
  }
}

// ---------- 盘面模板（FR-5.3）----------
function renderStage() {
  const st = $("stage");
  const s = latestState();
  if (!s) { st.innerHTML = ""; return; }
  const t = meta.stage || {};
  if (t.type === "leaderboard") st.innerHTML = tplLeaderboard(s, t);
  else if (t.type === "proposal_vote") st.innerHTML = tplProposalVote(s, t);
  else if (t.type === "cell_grid") st.innerHTML = tplCellGrid(s, t);
  else st.innerHTML = `<pre style="font-size:12px;color:var(--dim)">${JSON.stringify(s, null, 2)}</pre>`;
}

function tplLeaderboard(s, t) {
  const barField = t.bar_field || "last_bid";
  const vals = Object.values(s.players).map(p => p[barField] || 0);
  const maxV = Math.max(0.01, ...vals);
  const rows = Object.entries(s.players)
    .sort((a, b) => (b[1][barField] || 0) - (a[1][barField] || 0))
    .map(([pid, ps]) => {
      const p = playerOf(pid);
      const w = Math.round(100 * (ps[barField] || 0) / maxV);
      const v = ps[barField] ?? 0;
      const vText = (t.unit === "$" || t.unit === "¥") ? `${t.unit}${v}` : `${v}${t.unit || ""}`;
      return `<div class="bar-row"><div class="bl"><span>${p.name}</span><span>${vText}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${p.color}"></div></div></div>`;
    }).join("");
  const leader = s[t.leader_field] ? playerOf(s[t.leader_field]).name : "—";
  const val = s[t.value_field] ?? 0;
  const money = (t.unit === "$" || t.unit === "¥");
  const valText = money ? `${t.unit}${val}` : `${val}${t.unit || ""}`;
  const face = s.current_face ? ` × ${s.current_face} 点` : "";
  return `<div class="pot"><div class="lab">${t.value_label || "当前最高"}</div>
    <div class="val">${valText}${face}</div>
    <div class="leader">👑 ${leader}</div></div>${rows}`;
}

function tplProposalVote(s, t) {
  const proposal = s[t.proposal_field] || {};
  const votes = s[t.votes_field] || {};
  const total = Math.max(1, Object.values(proposal).reduce((a, b) => a + b, 0));
  const proposer = s[t.proposer_field];
  let bars = Object.entries(proposal)
    .sort((a, b) => b[1] - a[1])
    .map(([pid, amt]) => {
      const p = playerOf(pid);
      const w = Math.round(100 * amt / total);
      return `<div class="bar-row"><div class="bl"><span>${p.name}</span><span>${amt}${t.unit || ""}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${p.color}"></div></div></div>`;
    }).join("") || `<div style="color:var(--dim);text-align:center">等待提案……</div>`;
  let voteRows = (s.alive || meta.players.map(p => p.id)).map(pid => {
    const p = playerOf(pid);
    const v = votes[pid];
    const mark = v === "yes" ? '<span class="vote-yes">✔ 赞成</span>'
               : v === "no" ? '<span class="vote-no">✘ 反对</span>'
               : '<span class="vote-pending">… 未投</span>';
    const crown = pid === proposer ? " 👑" : "";
    return `<div class="pv-vote-row"><span>${p.emoji} ${p.name}${crown}</span>${mark}</div>`;
  }).join("");
  const pName = proposer ? playerOf(proposer).name : "—";
  return `<div class="pv-proposal"><div class="pv-title">👑 ${pName} 的分配方案（共 ${total}${t.unit || ""}）</div>${bars}</div>
    <div class="pv-title">表决</div>${voteRows}`;
}

// 独牢牢房盘面（cell_grid）：上帝视角展示每个人项圈颜色/身份/预算/猜测
function tplCellGrid(s, t) {
  const target = t.target_safe || 4;
  const safe = s.consecutive_safe || 0;
  const phase = s.phase === "guess" ? "🎭 猜测阶段" : "💬 沟通阶段";
  const cells = meta.players.map(p => {
    const ps = (s.players && s.players[p.id]) || {};
    const dead = ps.alive === false;
    const hex = ps.color_hex || "#888";
    const trick = ps.is_trickster ? " 🎭" : "";
    let status;
    if (dead) status = "☠️ 淘汰";
    else if (s.phase === "guess" && ps.last_guess) status = `猜「${ps.last_guess}」`;
    else if (ps.budget !== undefined) status = `🗣${ps.budget}`;
    else status = "";
    return `<div class="cell ${dead ? "dead" : ""}">
      <div class="cell-swatch" style="background:${hex}"></div>
      <div class="cell-name">${p.emoji} ${p.name}${trick}</div>
      <div class="cell-color">${ps.color || "？"}</div>
      <div class="cell-status">${status}</div></div>`;
  }).join("");
  return `<div class="cg-header"><div class="cg-round">第 ${s.round_no || 1} 轮 · ${phase}</div>
    <div class="cg-safe">连续安全 ${safe} / ${target}</div></div><div class="cg-grid">${cells}</div>`;
}

// ---------- 事件渲染 ----------
function renderEvent(e) {
  const stream = $("stream");
  if (e.type === "game_end") {
    const win = e.winner ? playerOf(e.winner).name : "无";
    let html = `<div class="sys">🏆 对局结束，赢家：${win}</div>`;
    if (e.settlement) {
      html += `<div class="sys" style="color:var(--dim)">` +
        Object.entries(e.settlement).map(([pid, r]) => {
          return `${playerOf(pid).name} ${r.net >= 0 ? "+" : ""}${r.net}`;
        }).join(" ｜ ") + `</div>`;
    }
    stream.insertAdjacentHTML("beforeend", html);
  } else if (e.type === "action") {
    const cls = "bubble" + (e.highlight ? " highlight" : "");
    let revealHtml = "";
    if (e.reveal) {
      const first = Object.values(e.reveal)[0];
      const isStr = typeof first === "string";
      revealHtml = `<div class="sys reveal">${isStr ? "🎨 揭示颜色" : "🎲 开骰"}：` +
        Object.entries(e.reveal).map(([pid, v]) =>
          `${playerOf(pid).name}[${Array.isArray(v) ? v.join(" ") : v}]`).join("　") + `</div>`;
    }
    let actMsg = "";
    if (e.action && e.action.type === "private_chat" && e.action.message) {
      actMsg = `<div class="act-msg">悄悄对 ${e.action.target} 说：${escapeHtml(e.action.message)}</div>`;
    }
    stream.insertAdjacentHTML("beforeend",
      `<div class="${cls}"><div class="who">${e.emoji || ""} ${e.player} · 第${e.round}轮</div>
       <div class="speech">${escapeHtml(e.speech)}</div>
       ${e.thought ? `<div class="thought">${escapeHtml(e.thought)}</div>` : ""}
       ${actMsg}
       ${e.note ? `<div class="hl-note">${escapeHtml(e.note)}</div>` : ""}</div>` + revealHtml);
  }
  stream.scrollTop = stream.scrollHeight;
  $("round-ind").textContent = e.round ? `第 ${e.round} 轮` : "";
  renderSidebar(e.player_id);
  renderStage();
}

// ---------- 播放控制（自动导演，FR-5.6）----------
function beep() {  // 高光音效提示
  try {
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.08;
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    o.stop(ctx.currentTime + 0.25);
  } catch (_) {}
}

function stepNext() {
  if (idx >= events.length - 1) { pause(); return; }
  let target = idx + 1;
  if (hlOnly) {  // 只播高光：跳到下一个高光或结尾
    while (target < events.length - 1 && !events[target].highlight
           && events[target].type !== "game_end") target++;
  }
  while (idx < target) { idx++; renderEvent(events[idx]); }
  $("progress").value = idx;
  if (events[idx] && events[idx].highlight) beep();
  if (idx >= events.length - 1) pause();
}
function stepPrev() {
  if (idx < 0) return;
  idx--; $("stream").innerHTML = "";
  for (let i = 0; i <= idx; i++) renderEvent(events[i]);
  if (idx < 0) { renderSidebar(); renderStage(); }
  $("progress").value = Math.max(0, idx);
}
function nextHighlight() {
  for (let i = idx + 1; i < events.length; i++) {
    if (events[i].highlight) { while (idx < i) stepNext(); return; }
  }
}
function play() { playing = true; $("btn-play").textContent = "⏸ 暂停"; schedule(); }
function pause() { playing = false; $("btn-play").textContent = "▶ 播放"; clearTimeout(timer); }
function schedule() {
  if (!playing) return;
  if (idx >= events.length - 1) { pause(); return; }
  const e = events[idx + 1];
  const base = e && e.speech ? 1200 + String(e.speech).length * 60 : 1000;
  const hl = e && e.highlight ? 1.8 : 1;
  const speed = parseFloat($("speed").value);
  timer = setTimeout(() => { stepNext(); schedule(); }, base * hl / speed);
}

$("btn-play").onclick = () => playing ? pause() : play();
$("btn-next").onclick = () => { pause(); stepNext(); };
$("btn-prev").onclick = () => { pause(); stepPrev(); };
$("btn-hl").onclick = () => { pause(); nextHighlight(); };
$("btn-hlonly").onclick = e => {
  hlOnly = !hlOnly;
  e.target.classList.toggle("on", hlOnly);
};
$("progress").oninput = e => {
  pause(); const target = parseInt(e.target.value);
  $("stream").innerHTML = ""; idx = -1;
  for (let i = 0; i <= target; i++) { idx = i; renderEvent(events[i]); }
  if (idx < 0) { renderSidebar(); renderStage(); }
};
$("btn-orient").onclick = e => {
  document.body.classList.toggle("portrait");
  e.target.classList.toggle("on");
};
$("btn-obs").onclick = e => {
  document.body.classList.toggle("obs");
  e.target.classList.toggle("on");
};
document.onkeydown = e => {
  if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(); }
  if (e.code === "ArrowRight") { pause(); stepNext(); }
  if (e.code === "ArrowLeft") { pause(); stepPrev(); }
};
</script>
</body>
</html>
